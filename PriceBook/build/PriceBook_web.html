<style>
/* Layout: counter-lookup tool. One sticky search bar, results grouped by price-sheet section, tap a row for provenance. */
:root {
  --bg: #f4f6f7; --panel: #ffffff; --ink: #15191d; --muted: #5a646d; --rule: #d8dde2;
  --accent: #006fa8; --accent-ink: #ffffff; --chip: #e7ecef;
  --warn: #8f5200; --warn-bg: #fff1d9; --none: #a32920; --none-bg: #fde8e6;
  --c: #00a0dc; --m: #d4147f; --y: #f2c500; --k: #15191d;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101316; --panel: #171b1f; --ink: #e7ebee; --muted: #9ba5ae; --rule: #2b3238;
  --accent: #53b6e8; --accent-ink: #0b1216; --chip: #22282e;
  --warn: #f2b660; --warn-bg: #2e2413; --none: #ff8a80; --none-bg: #341a18; --k: #e7ebee; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101316; --panel: #171b1f; --ink: #e7ebee; --muted: #9ba5ae; --rule: #2b3238;
  --accent: #53b6e8; --accent-ink: #0b1216; --chip: #22282e;
  --warn: #f2b660; --warn-bg: #2e2413; --none: #ff8a80; --none-bg: #341a18; --k: #e7ebee; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--rule); padding-block: 12px 10px }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; letter-spacing: .01em; margin: 0; text-wrap: balance }
.reg { display: inline-flex; gap: 3px; transform: translateY(-2px) }
.reg i { width: 9px; height: 9px; display: block }
.reg i:nth-child(1) { background: var(--c) } .reg i:nth-child(2) { background: var(--m) }
.reg i:nth-child(3) { background: var(--y) } .reg i:nth-child(4) { background: var(--k) }
.meta { color: var(--muted); font-size: .82rem }
.searchrow { display: flex; gap: 8px; margin-top: 10px }
#q { flex: 1; min-width: 0; font: inherit; font-size: 1.08rem; padding: 11px 14px; border-radius: 10px;
  border: 1.5px solid var(--rule); background: var(--panel); color: var(--ink) }
#q:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent) }
.tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap }
.chip { font: inherit; font-size: .82rem; border: 1px solid transparent; background: var(--chip); color: var(--ink);
  padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.chip:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.banner { margin-top: 14px; background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--warn);
  padding: 9px 12px; border-radius: 6px; font-size: .88rem }
.banner b { color: var(--warn) }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center }
.examples span { color: var(--muted); font-size: .82rem; margin-right: 2px }
section.cat { margin-top: 22px }
section.cat h2 { font-family: var(--display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px }
section.cat h2 small { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 400 }
.catnote { color: var(--muted); font-size: .8rem; margin: -2px 0 8px }
.list { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 14px;
  border-top: 1px solid var(--rule); cursor: pointer }
.row:first-child { border-top: 0 }
.row:hover { background: color-mix(in srgb, var(--chip) 55%, transparent) }
.item { font-weight: 700; min-width: 0 }
.det { color: var(--muted); font-size: .86rem; min-width: 0 }
.price { font-family: var(--mono); font-weight: 600; font-size: 1.06rem; text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center }
.price small { font-family: var(--body); font-weight: 400; font-size: .74rem; color: var(--muted); margin-left: 3px }
.pill { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .03em; padding: 1px 7px;
  border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap }
.pill.pending { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn) }
.pill.none { background: var(--none-bg); color: var(--none); border: 1px solid var(--none) }
.row.pending { box-shadow: inset 3px 0 0 var(--warn) }
.row.unpriced { box-shadow: inset 3px 0 0 var(--none) }
.more { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); border-top: 1px dashed var(--rule);
  margin-top: 6px; padding-top: 6px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px }
.more dt { font-weight: 700; color: var(--ink) } .more dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.empty { margin-top: 30px; color: var(--muted); text-align: center }
.contacts .row { cursor: default }
.contacts .price { font-size: .95rem; font-weight: 500; user-select: all }
footer { margin-top: 36px; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--rule); padding-top: 10px }
@media (max-width: 620px) { .brand h1 { font-size: 1.3rem } .price { font-size: .98rem }
  .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

  <div id="banner"></div>

</div>

  if (DATA.cards.length) {
    $("#banner").innerHTML = `<div class="banner"><b>${DATA.cards.length} open question${DATA.cards.length === 1 ? "" : "s"}:</b> ${DATA.cards.map(c => esc(c.id + " " + c.title)).join("; ")}. <b>PENDING</b> rows are waiting on that decision; <b>NO PRICE</b> means none on file yet. Tap a row for details.</div>`;
  }
  $("#examples").innerHTML = `<span>Try</span>` + ["24x36", "b/w letter 150 duplex", "color 11x17", "laminate", "business cards 500",
    "banner", "photo 16x20", "comb binding", "sharpie", "scan"].map(e => `<button class="chip" type="button" data-ex="${esc(e)}">${esc(e)}</button>`).join("");
  $("#foot").innerHTML = `Generated from the shop's price data on ${esc(DATA.generated)}. To change a price, tell Claude in the Rainbow project: “24x36 color is now $14.95.” Sizes are inches, either orientation. Prices exclude sales tax.`;

  document.addEventListener("click", e => {
    const b = e.target.closest("button.chip");
    if (b) {
      if (b.dataset.ex) { $("#q").value = b.dataset.ex; cat = "All"; view = "prices"; }
      else if (b.dataset.view) { view = "contacts"; }
      else { cat = b.dataset.cat; view = "prices"; }
      render(); return;
    }
    const r = e.target.closest(".row[role=button]");
    if (r) toggle(r);
  });
  document.addEventListener("keydown", e => {
    const r = e.target.closest && e.target.closest(".row[role=button]");
    if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(r); }
  });
  function toggle(r) { const m = r.querySelector(".more"); m.hidden = !m.hidden; r.setAttribute("aria-expanded", String(!m.hidden)); }
  let t; $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 90); });
  render();
})();
</script>
